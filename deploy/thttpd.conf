# HISTORICAL FILENAME - NOT USED SINCE v1.0.1.
#
# The server is now bozohttpd (NetBSD base httpd).  Its options are built
# directly into deploy/boot_hook.sh because bozohttpd has no config file:
#
#   httpd -b -I 8080 -i 0.0.0.0 -C .cgi <WEB_ROOT>/bin/upload_shim -X -H \
#         -P <WEB_ROOT>/state/bozohttpd.pid <SHARE_DIR>
#
# Option notes verified against src/libexec/httpd/main.c and bozohttpd.8:
#   -b  daemon mode (mandatory; without it bozohttpd expects inetd stdin)
#   -I  listening port  (NOT -p: that is the public_html directory name)
#   -i  bind address (daemon mode only)
#   -C  suffix -> absolute CGI handler; URL /upload.cgi lands in the docroot
#   -X  directory index (off by default), -H hide dotfiles
#   -P  pidfile (daemon mode only)
#   positional: slashdir / document root (bozohttpd chdir(2)s there)
#
# -C keeps the CGI request in the docroot, so ONE .htpasswd in the document
# root protects both GET / and POST /upload.cgi.  This file is kept only so
# older deployment instructions do not break.
