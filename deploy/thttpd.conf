# thttpd configuration template for AirPort Time Capsule (firmware 7.9.1).
# Installed to /Volumes/dk2/.tc_webshare/etc/thttpd.conf
# Format: one "key=value" per line, no spaces around '='.

# LAN-only plaintext HTTP. TLS is deliberately out of scope for this release.
port=8080
host=0.0.0.0

# Document root holds user uploads. CGI is reached at /cgi-bin/upload.cgi.
dir=/Volumes/dk2/share/web
cgipat=/cgi-bin/**

# Bounded concurrency: downloads are served with zero fork; the upload CGI
# enforces its own single-writer lock (upload.lock).
maxconns=10
timeout=60

# Run as root: the device has no separate unprivileged web user, and the CGI
# must be able to create files in the data directory.
user=root
charset=UTF-8

logfile=/Volumes/dk2/.tc_webshare/state/thttpd.log
pidfile=/Volumes/dk2/.tc_webshare/state/thttpd.pid

# Basic auth (NOT a secret in this template):
# thttpd reads .htpasswd from the served directory. install.sh places a
# symlink /Volumes/dk2/share/web/.htpasswd ->
# /Volumes/dk2/.tc_webshare/etc/htpasswd and fills it from TC_WEB_USER /
# TC_WEB_PASSWORD or TC_WEB_PASS_HASH. Unauthenticated GET / must return 401.
# See htpasswd.example for the file format (placeholder only).
