<!doctype html>
<!-- tc-webshare management homepage. Installed as a hidden program file
     (docroot/.tc-webshare-index.html) and served via bozohttpd -x. This file
     is NOT user data; uninstall removes exactly this name. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tc-webshare</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#d8dde3;--fg:#1d2430;--muted:#667085;--accent:#2563eb;--danger:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{background:#101828;color:#fff;padding:18px 24px}
header h1{margin:0;font-size:19px;font-weight:600}
header p{margin:4px 0 0;color:#98a2b3;font-size:13px}
main{max-width:1000px;margin:24px auto;padding:0 20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.tools{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
input[type=text],input[type=file]{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;font:inherit;max-width:280px}
button,.btn{border:0;border-radius:6px;background:var(--accent);color:#fff;padding:9px 14px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{filter:brightness(.95)}
button:disabled{opacity:.5;cursor:not-allowed}
.status{margin-top:12px;min-height:20px;font-size:13px;color:var(--muted)}
.status.err{color:var(--danger)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.name{word-break:break-all}
td.size,td.time{white-space:nowrap;color:var(--muted)}
a{color:var(--accent);text-decoration:none}
.empty{padding:24px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>tc-webshare · 文件共享</h1>
  <p>AirPort Time Capsule · 局域网明文 HTTP（仅可信内网使用）</p>
</header>
<main>
  <section class="panel">
    <div class="tools">
      <div class="field">
        <label for="file">上传文件</label>
        <div class="row">
          <input type="file" id="file" multiple>
          <button id="uploadBtn" type="button">上传</button>
        </div>
      </div>
      <div class="field">
        <label for="folder">新建文件夹</label>
        <div class="row">
          <input type="text" id="folder" placeholder="名称：字母/数字/._-" maxlength="200">
          <button id="mkdirBtn" type="button">创建</button>
        </div>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button id="refreshBtn" type="button">刷新列表</button>
      </div>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="panel">
    <table>
      <thead><tr><th>名称</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead>
      <tbody id="rows"><tr><td colspan="4" class="empty">加载中…</td></tr></tbody>
    </table>
  </section>
</main>

<script>
(function () {
  'use strict';
  var statusEl = document.getElementById('status');
  var rowsEl = document.getElementById('rows');
  var fileEl = document.getElementById('file');
  var folderEl = document.getElementById('folder');

  function status(text, isError) {
    statusEl.textContent = text || '';
    statusEl.className = 'status' + (isError ? ' err' : '');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function humanSize(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + ' B';
    var u = ['KB','MB','GB','TB'], i = -1, v = n;
    do { v /= 1024; i++; } while (v >= 1024 && i < u.length - 1);
    return v.toFixed(v >= 10 ? 0 : 1) + ' ' + u[i];
  }

  function render(entries) {
    rowsEl.innerHTML = '';
    if (!entries.length) {
      rowsEl.innerHTML = '<tr><td colspan="4" class="empty">目录为空</td></tr>';
      return;
    }
    entries.forEach(function (e) {
      var tr = document.createElement('tr');
      var nameCell = document.createElement('td');
      nameCell.className = 'name';
      if (e.dir) {
        nameCell.innerHTML = '📁 ' + escapeHtml(e.name) + '/';
      } else {
        var a = document.createElement('a');
        a.href = '/' + encodeURIComponent(e.name);
        a.textContent = e.name;
        nameCell.innerHTML = '📄 ';
        nameCell.appendChild(a);
      }
      var size = document.createElement('td');
      size.className = 'size';
      size.textContent = e.dir ? '—' : humanSize(e.size);
      var time = document.createElement('td');
      time.className = 'time';
      time.textContent = (e.mtime || '').replace('T',' ').replace('Z','');
      var op = document.createElement('td');
      if (!e.dir) {
        var dl = document.createElement('a');
        dl.href = '/' + encodeURIComponent(e.name);
        dl.textContent = '下载';
        op.appendChild(dl);
      } else {
        op.textContent = '—';
      }
      tr.appendChild(nameCell); tr.appendChild(size); tr.appendChild(time); tr.appendChild(op);
      rowsEl.appendChild(tr);
    });
  }

  function refresh() {
    status('');
    var req = new XMLHttpRequest();
    req.open('GET', '/list.cgi', true);
    req.onreadystatechange = function () {
      if (req.readyState !== 4) return;
      if (req.status === 401) { status('会话认证已失效，请重新输入用户名/口令。', true); return; }
      if (req.status !== 200) { status('列表读取失败：HTTP ' + req.status, true); return; }
      try { render(JSON.parse(req.responseText)); }
      catch (err) { status('列表解析失败', true); }
    };
    req.send();
  }

  document.getElementById('refreshBtn').onclick = refresh;

  document.getElementById('mkdirBtn').onclick = function () {
    var name = folderEl.value.trim();
    if (!name) { status('请输入文件夹名称', true); return; }
    var req = new XMLHttpRequest();
    req.open('POST', '/mkdir.cgi', true);
    req.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    req.onreadystatechange = function () {
      if (req.readyState !== 4) return;
      if (req.status === 200) { folderEl.value = ''; status('已创建：' + name); refresh(); }
      else { status('创建失败：HTTP ' + req.status, true); }
    };
    req.send('name=' + encodeURIComponent(name));
  };

  document.getElementById('uploadBtn').onclick = function () {
    if (!fileEl.files || !fileEl.files.length) { status('请先选择文件', true); return; }
    var fd = new FormData();
    for (var i = 0; i < fileEl.files.length; i++) fd.append('file', fileEl.files[i]);
    var req = new XMLHttpRequest();
    req.open('POST', '/upload.cgi', true);
    req.onreadystatechange = function () {
      if (req.readyState !== 4) return;
      if (req.status === 200) { status('上传完成：' + req.responseText); fileEl.value = ''; refresh(); }
      else { status('上传失败：HTTP ' + req.status + ' ' + req.responseText, true); }
    };
    req.send(fd);
  };

  refresh();
}());
</script>
</body>
</html>
