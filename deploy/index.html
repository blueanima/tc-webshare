<!doctype html>
<!-- tc-webshare management homepage. Installed as a hidden program file
     (docroot/.tc-webshare-index.html) and served via bozohttpd -x. This file
     is NOT user data; uninstall removes exactly this name. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tc-webshare</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#d8dde3;--fg:#1d2430;--muted:#667085;--accent:#2563eb;--danger:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{background:#101828;color:#fff;padding:18px 24px}
header h1{margin:0;font-size:19px;font-weight:600}
header p{margin:4px 0 0;color:#98a2b3;font-size:13px}
main{max-width:1000px;margin:24px auto;padding:0 20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.tools{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
input[type=text],input[type=password],input[type=file]{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;font:inherit;max-width:280px}
button,.btn{border:0;border-radius:6px;background:var(--accent);color:#fff;padding:9px 14px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{filter:brightness(.95)}
button:disabled{opacity:.5;cursor:not-allowed}
.status{margin-top:12px;min-height:20px;font-size:13px;color:var(--muted)}
.status.err{color:var(--danger)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.name{word-break:break-all}
td.size,td.time{white-space:nowrap;color:var(--muted)}
td.op{white-space:nowrap}
a{color:var(--accent);text-decoration:none}
.empty{padding:24px;text-align:center;color:var(--muted)}
[hidden]{display:none !important}
.progress{display:flex;align-items:center;gap:10px;margin-top:10px}
.progress-track{flex:1;max-width:420px;height:10px;background:#e4e7ec;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--accent);transition:width .12s linear}
.progress-text{font-size:12px;color:var(--muted);min-width:118px;white-space:nowrap;font-variant-numeric:tabular-nums}
button.mini{padding:4px 9px;font-size:12px;margin-left:10px}
button.danger{background:var(--danger)}
button.secondary{background:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal-card{background:#fff;border-radius:10px;padding:20px;min-width:320px;max-width:92vw;box-shadow:0 12px 32px rgba(16,24,40,.2)}
.modal-card h2{margin:0 0 10px;font-size:16px}
.modal-card p{margin:0 0 12px;color:var(--muted);font-size:13px;word-break:break-all}
.modal-card label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.modal-card .msg{min-height:18px;margin:8px 0 0;font-size:12px;color:var(--danger)}
select{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;font:inherit;max-width:100%;margin-bottom:14px}
.field select{margin-bottom:0}
</style>
</head>
<body>
<!-- All visible copy below is filled by setLang() from the I18N table.
     The only literal language names are the endonyms in the <select>. -->
<header>
  <h1 id="appTitle"></h1>
  <p id="appSubtitle"></p>
</header>
<main>
  <section class="panel">
    <div class="tools">
      <div class="field">
        <label for="file" id="labelFile"></label>
        <div class="row">
          <input type="file" id="file" multiple>
          <button id="uploadBtn" type="button"></button>
        </div>
      </div>
      <div class="field">
        <label for="folder" id="labelFolder"></label>
        <div class="row">
          <input type="text" id="folder" maxlength="200">
          <button id="mkdirBtn" type="button"></button>
        </div>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button id="refreshBtn" type="button"></button>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button id="passwdBtn" type="button" class="secondary"></button>
      </div>
      <div class="field">
        <label for="langSelect" id="langLabel"></label>
        <select id="langSelect">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>
    <div class="status" id="status"></div>
    <div class="progress" id="progressWrap" hidden>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-text" id="progressText">0%</span>
    </div>
  </section>

  <section class="panel">
    <table>
      <thead><tr><th id="thName"></th><th id="thSize"></th><th id="thMtime"></th><th id="thOp"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>

<div class="modal" id="moveModal" hidden>
  <div class="modal-card">
    <h2 id="moveTitle"></h2>
    <p id="moveInfo"></p>
    <label for="moveTarget" id="moveTargetLabel"></label>
    <select id="moveTarget"></select>
    <div class="row">
      <button id="moveConfirm" type="button"></button>
      <button id="moveCancel" type="button" class="secondary"></button>
    </div>
  </div>
</div>

<div class="modal" id="passwdModal" hidden>
  <div class="modal-card">
    <h2 id="passwdTitle"></h2>
    <p id="passwdDesc"></p>
    <label for="newPass1" id="passwdLabel1"></label>
    <input type="password" id="newPass1" autocomplete="new-password" maxlength="200">
    <label for="newPass2" id="passwdLabel2"></label>
    <input type="password" id="newPass2" autocomplete="new-password" maxlength="200">
    <p class="msg" id="passwdMsg"></p>
    <div class="row">
      <button id="passwdConfirm" type="button"></button>
      <button id="passwdCancel" type="button" class="secondary"></button>
    </div>
  </div>
</div>

<script>

      'status.mkdir.done': 'Created: {name}',
      'err.mkdir.http': 'Create failed: HTTP {code}',
      'err.upload.noFile': 'Select a file first',
      'status.avg': ' · avg {speed}',
      'status.uploaded': 'Upload complete: {detail}{avg}',
      'err.upload.http': 'Upload failed: HTTP {code} {detail}',

      'status.uploading': 'Uploading…',
      'err.upload.failed': 'Upload failed: {detail}'

  };

  /* Static HTML nodes: id -> translated key (textContent or attribute). */
  var STATIC_BINDINGS = [
    {id: 'appTitle', key: 'app.title'},
    {id: 'appSubtitle', key: 'app.subtitle'},
    {id: 'langLabel', key: 'ui.language'},
    {id: 'labelFile', key: 'label.upload'},
    {id: 'labelFolder', key: 'label.folder'},
    {id: 'uploadBtn', key: 'btn.upload'},
    {id: 'mkdirBtn', key: 'btn.mkdir'},
    {id: 'refreshBtn', key: 'btn.refresh'},
    {id: 'passwdBtn', key: 'btn.passwd'},
    {id: 'folder', key: 'folder.placeholder', attr: 'placeholder'},
    {id: 'folder', key: 'folder.title', attr: 'title'},
    {id: 'thName', key: 'table.name'},
    {id: 'thSize', key: 'table.size'},
    {id: 'thMtime', key: 'table.mtime'},
    {id: 'thOp', key: 'table.op'},
    {id: 'moveTitle', key: 'move.title'},
    {id: 'moveTargetLabel', key: 'move.targetLabel'},
    {id: 'moveConfirm', key: 'move.confirm'},
    {id: 'moveCancel', key: 'cancel'},
    {id: 'passwdTitle', key: 'passwd.title'},
    {id: 'passwdDesc', key: 'passwd.desc'},
    {id: 'passwdLabel1', key: 'passwd.label1'},
    {id: 'passwdLabel2', key: 'passwd.label2'},
    {id: 'passwdConfirm', key: 'passwd.confirm'},
    {id: 'passwdCancel', key: 'cancel'}
  ];

  var lang = 'zh';
  var lastStatus = null;
  var lastPasswdMsg = null;
  var lastMoveInfoName = '';
  var hasList = false;

  var statusEl = document.getElementById('status');
  var rowsEl = document.getElementById('rows');
  var fileEl = document.getElementById('file');
  var folderEl = document.getElementById('folder');
  var uploadBtn = document.getElementById('uploadBtn');
  var progressWrap = document.getElementById('progressWrap');
  var progressFill = document.getElementById('progressFill');
  var progressText = document.getElementById('progressText');
  var langSelect = document.getElementById('langSelect');
  var moveModal = document.getElementById('moveModal');
  var moveInfo = document.getElementById('moveInfo');
  var moveTarget = document.getElementById('moveTarget');
  var moveConfirm = document.getElementById('moveConfirm');
  var moveCancel = document.getElementById('moveCancel');
  var passwdBtn = document.getElementById('passwdBtn');
  var passwdModal = document.getElementById('passwdModal');
  var newPass1 = document.getElementById('newPass1');
  var newPass2 = document.getElementById('newPass2');
  var passwdMsg = document.getElementById('passwdMsg');
  var passwdConfirm = document.getElementById('passwdConfirm');
  var passwdCancel = document.getElementById('passwdCancel');
  var currentEntries = [];
  var moveSource = '';
  /* A successful password change leaves this tab holding the OLD Basic-auth
   * credentials.  Every later request will 401 until the browser's cache is
   * dropped; remember that so the message explains the cause instead of a
   * generic "session expired". */
  var authStale = false;

  /* v1.0.5: XHR onprogress fires in bursts, so sample at most ~8x/second and
   * smooth with an exponential moving average to keep the speed readable. */
  var SPEED_SAMPLE_MS = 120;
  var SPEED_SMOOTH = 0.35;
  var speedLastLoaded = 0;
  var speedLastTime = 0;
  var speedStart = 0;
  var speedSeen = 0;
  var speedValue = 0;
  var batchBytes = 0;

  function t(key, params) {
    var table = I18N[lang] || I18N.zh;
    var text = Object.prototype.hasOwnProperty.call(table, key)
      ? table[key] : (I18N.zh[key] || key);
    if (!params) return text;
    return String(text).replace(/\{(\w+)\}/g, function (match, name) {
      return Object.prototype.hasOwnProperty.call(params, name)
        ? String(params[name]) : match;
    });
  }

  function loadLang() {
    try {
      if (typeof localStorage === 'undefined' || !localStorage) return 'zh';
      return localStorage.getItem(LANG_KEY) === 'en' ? 'en' : 'zh';
    } catch (err) {
      return 'zh';
    }
  }

  function saveLang(value) {
    try {
      if (typeof localStorage === 'undefined' || !localStorage) return;
      localStorage.setItem(LANG_KEY, value);
    } catch (err) {
      /* Disabled storage (private mode): the choice still applies in memory. */
    }
  }

  function setLang(next) {
    lang = next === 'en' ? 'en' : 'zh';
    if (document.documentElement) {
      document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
    }
    STATIC_BINDINGS.forEach(function (binding) {
      var el = document.getElementById(binding.id);
      if (!el) return;
      if (binding.attr) el[binding.attr] = t(binding.key);
      else el.textContent = t(binding.key);
    });
    if (langSelect) langSelect.value = lang;
    /* Re-render every already-visible dynamic string without a new request. */
    if (lastStatus) status(t(lastStatus.key, lastStatus.params), lastStatus.isError);
    if (lastPasswdMsg) passwdMsg.textContent = t(lastPasswdMsg.key, lastPasswdMsg.params);
    if (lastMoveInfoName && !moveModal.hidden) setMoveInfo(lastMoveInfoName);
    if (hasList) render(currentEntries);
    else showLoading();
    saveLang(lang);
  }

  if (langSelect) {
    langSelect.onchange = function () { setLang(langSelect.value); };
  }

  function nowMs() {
    return (window.performance && typeof performance.now === 'function')
      ? performance.now() : Date.now();
  }

  function formatSpeed(bytesPerSec) {
    var v = Number(bytesPerSec) || 0;
    if (v < 1) return '--';
    if (v < 1024) return v.toFixed(0) + ' B/s';
    if (v < 1024 * 1024) return (v / 1024).toFixed(1) + ' KB/s';
    return (v / (1024 * 1024)).toFixed(1) + ' MB/s';
  }

  function resetSpeed() {
    var t0 = nowMs();
    speedLastLoaded = 0;
    speedLastTime = t0;
    speedStart = t0;
    speedSeen = t0;
    speedValue = 0;
    batchBytes = 0;
  }

  function showProgress(pct, speed) {
    var value = Math.max(0, Math.min(100, Math.round(pct)));
    progressWrap.hidden = false;
    progressFill.style.width = value + '%';
    progressText.textContent = value + '%' + (speed ? ' · ' + speed : '');
  }

  function hideProgress() {
    progressWrap.hidden = true;
    progressFill.style.width = '0%';
    progressText.textContent = '0%';
  }

  function status(text, isError) {
    statusEl.textContent = text || '';
    statusEl.className = 'status' + (isError ? ' err' : '');
  }

  function setStatus(key, params, isError) {
    var values = params || {};
    lastStatus = {key: key, params: values, isError: !!isError};
    status(t(key, values), !!isError);
  }

  function clearStatus() {
    lastStatus = null;
    status('', false);
  }

  function setPasswdMsg(key, params) {
    var values = params || {};
    lastPasswdMsg = {key: key, params: values};
    passwdMsg.textContent = t(key, values);
  }

  function clearPasswdMsg() {
    lastPasswdMsg = null;
    passwdMsg.textContent = '';
  }

  function setMoveInfo(name) {
    lastMoveInfoName = name;
    moveInfo.textContent = t('move.info', {name: name});
  }

  function authHintKey() {
    return authStale ? 'auth.stale' : 'auth.invalid';
  }

  function utf8Bytes(text) {
    if (typeof TextEncoder === 'function') {
      try { return new TextEncoder().encode(text).length; } catch (e) { /* fallback */ }
    }
    var n = 0;
    for (var i = 0; i < text.length; i++) {
      var c = text.charCodeAt(i);
      if (c < 0x80) n++;
      else if (c < 0x800) n += 2;
      else if (c >= 0xd800 && c <= 0xdbff && i + 1 < text.length &&
               text.charCodeAt(i + 1) >= 0xdc00 &&
               text.charCodeAt(i + 1) <= 0xdfff) { n += 4; i++; }
      else n += 3;
    }
    return n;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function humanSize(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + ' B';
    var u = ['KB','MB','GB','TB'], i = -1, v = n;
    do { v /= 1024; i++; } while (v >= 1024 && i < u.length - 1);
    return v.toFixed(v >= 10 ? 0 : 1) + ' ' + u[i];
  }

  function showLoading() {
    hasList = false;
    currentEntries = [];
    rowsEl.innerHTML = '<tr><td colspan="4" class="empty">' +
      escapeHtml(t('list.loading')) + '</td></tr>';
  }

  function render(entries) {
    currentEntries = entries.slice();
    hasList = true;
    rowsEl.innerHTML = '';
    if (!entries.length) {
      rowsEl.innerHTML = '<tr><td colspan="4" class="empty">' +
        escapeHtml(t('list.empty')) + '</td></tr>';
      return;
    }
    entries.forEach(function (e) {
      var tr = document.createElement('tr');
      var nameCell = document.createElement('td');
      nameCell.className = 'name';
      if (e.dir) {
        nameCell.innerHTML = '📁 ' + escapeHtml(e.name) + '/';
      } else {
        var a = document.createElement('a');
        a.href = '/' + encodeURIComponent(e.name);
        a.textContent = e.name;
        nameCell.innerHTML = '📄 ';
        nameCell.appendChild(a);
      }
      var size = document.createElement('td');
      size.className = 'size';
      size.textContent = e.dir ? '—' : humanSize(e.size);
      var time = document.createElement('td');
      time.className = 'time';
      time.textContent = (e.mtime || '').replace('T',' ').replace('Z','');
      var op = document.createElement('td');
      op.className = 'op';
      if (!e.dir) {
        var dl = document.createElement('a');
        dl.href = '/' + encodeURIComponent(e.name);
        dl.textContent = t('op.download');
        op.appendChild(dl);
      }
      /* The move button sits between download and delete; its target list
       * comes from the directories in the current listing. */
      var mv = document.createElement('button');
      mv.type = 'button';
      mv.className = 'mini';
      mv.textContent = t('op.move');
      mv.title = t('op.moveTitle');
      mv.onclick = (function (entryName) {
        return function () { openMove(entryName); };
      })(e.name);
      op.appendChild(mv);
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'mini danger';
      del.textContent = t('op.delete');
      del.title = e.dir ? t('op.deleteDirTitle') : t('op.deleteFileTitle');
      del.onclick = (function (entryName, entryIsDir) {
        return function () { deleteEntry(entryName, entryIsDir); };
      })(e.name, e.dir);
      op.appendChild(del);
      tr.appendChild(nameCell); tr.appendChild(size); tr.appendChild(time); tr.appendChild(op);
      rowsEl.appendChild(tr);
    });
  }

  /* Backend errors are JSON: {"ok":false,"error":"..."}.  Fall back to the
   * raw body if a proxy replaced it, e.g. with an HTML auth page. */
  function errorText(req) {
    try {
      var parsed = JSON.parse(req.responseText);
      if (parsed && parsed.error) return String(parsed.error);
    } catch (err) { /* not JSON */ }
    return String(req.responseText || '').trim();
  }

  function openMove(name) {
    var folders = currentEntries.filter(function (e) {
      return e.dir && e.name !== name;
    });
    if (!folders.length) {
      setStatus('err.mkdir.first', {}, true);
      return;
    }
    moveSource = name;
    moveTarget.innerHTML = '';
    folders.forEach(function (e) {
      var opt = document.createElement('option');
      opt.value = e.name;
      opt.textContent = e.name;
      moveTarget.appendChild(opt);
    });
    setMoveInfo(name);
    moveModal.hidden = false;
    if (typeof moveTarget.focus === 'function') moveTarget.focus();
  }

  function closeMove() {
    moveModal.hidden = true;
    moveSource = '';
  }

  function submitMove() {
    var to = moveTarget.value;
    var from = moveSource;
    if (!from || !to) { closeMove(); return; }
    closeMove();
    setStatus('status.moving', {}, false);
    var req = new XMLHttpRequest();
    var done = false;
    req.open('POST', '/move.cgi', true);
    req.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    req.onreadystatechange = function () {
      if (req.readyState !== 4 || done) return;
      done = true;
      if (req.status === 200) {
        /* refresh() clears the status line, so report AFTER refreshing. */
        refresh();
        setStatus('status.moved', {from: from, to: to}, false);
        return;
      }
      if (req.status === 401) { setStatus(authHintKey(), {}, true); return; }
      if (req.status === 400) { setStatus('err.move.invalidName', {}, true); return; }
      if (req.status === 403) {
        setStatus('err.move.failed', {detail: errorText(req)}, true);
        return;
      }
      if (req.status === 404) { setStatus('err.move.missing', {}, true); return; }
      if (req.status === 409) {
        setStatus('err.move.failed', {detail: errorText(req)}, true);
        return;
      }
      setStatus('err.move.http', {code: req.status, detail: errorText(req)}, true);
    };
    req.onerror = function () {
      if (done) return;
      done = true;
      setStatus('err.move.network', {}, true);
    };
    try {
      req.send('name=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to));
    } catch (err) {
      if (!done) {
        done = true;
        setStatus('err.move.failed', {detail: err.message}, true);
      }
    }
  }

  moveConfirm.onclick = submitMove;
  moveCancel.onclick = closeMove;

  function openPasswd() {
    newPass1.value = '';
    newPass2.value = '';
    clearPasswdMsg();
    passwdModal.hidden = false;
    if (typeof newPass1.focus === 'function') newPass1.focus();
  }

  function closePasswd() {
    passwdModal.hidden = true;
    newPass1.value = '';
    newPass2.value = '';
    clearPasswdMsg();
  }

  function submitPasswd() {
    var pass = newPass1.value;
    if (!pass) { setPasswdMsg('passwd.empty', {}); return; }
    if (pass !== newPass2.value) { setPasswdMsg('passwd.mismatch', {}); return; }
    if (/[\x00-\x1f\x7f]/.test(pass)) { setPasswdMsg('passwd.control', {}); return; }
    if (utf8Bytes(pass) > 200) { setPasswdMsg('passwd.toolong', {}); return; }

    clearPasswdMsg();
    passwdConfirm.disabled = true;
    setStatus('status.passwd.changing', {}, false);
    var req = new XMLHttpRequest();
    var done = false;
    req.open('POST', '/chpasswd.cgi', true);
    req.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');

    function finish(ok, key, params, isError) {
      if (done) return;
      done = true;
      passwdConfirm.disabled = false;
      newPass1.value = '';
      newPass2.value = '';
      if (ok) {
        authStale = true;
        closePasswd();
      }
      setStatus(key, params, isError);
    }

    req.onreadystatechange = function () {
      if (req.readyState !== 4 || done) return;
      if (req.status === 200) {
        /* No refresh(): the cached old credentials would immediately 401
         * and hide this explanation.  authStale makes any later 401 say why. */
        finish(true, 'passwd.success', {}, false);
        return;
      }
      if (req.status === 401) { finish(false, authHintKey(), {}, true); return; }
      if (req.status === 400 || req.status === 403) {
        var detail = errorText(req);
        setPasswdMsg('err.passwd.failed', {detail: detail});
        finish(false, 'err.passwd.failed', {detail: detail}, true);
        return;
      }
      finish(false, 'err.passwd.http',
        {code: req.status, detail: errorText(req)}, true);
    };
    req.onerror = function () {
      finish(false, 'err.passwd.network', {}, true);
    };
    try {
      req.send('new_password=' + encodeURIComponent(pass));
    } catch (err) {
      finish(false, 'err.passwd.failed', {detail: err.message}, true);
    }
  }

  passwdBtn.onclick = openPasswd;
  passwdConfirm.onclick = submitPasswd;
  passwdCancel.onclick = closePasswd;

  function deleteEntry(name, isDir) {
    var question = t(isDir ? 'confirm.deleteDir' : 'confirm.deleteFile', {name: name});
    if (!window.confirm(question)) return;
    var req = new XMLHttpRequest();
    req.open('POST', '/delete.cgi', true);
    req.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    req.onreadystatechange = function () {
      if (req.readyState !== 4) return;
      if (req.status === 200) {
        setStatus('status.deleted', {name: name}, false);
        refresh();
        return;
      }
      if (req.status === 401) { setStatus(authHintKey(), {}, true); return; }
      if (req.status === 404) { setStatus('err.delete.missing', {}, true); return; }
      if (req.status === 409) { setStatus('err.delete.notEmpty', {}, true); return; }
      setStatus('err.delete.http', {code: req.status, detail: req.responseText}, true);
    };
    req.send('name=' + encodeURIComponent(name));
  }

  function refresh() {
    clearStatus();
    var req = new XMLHttpRequest();
    req.open('GET', '/list.cgi', true);
    req.onreadystatechange = function () {
      if (req.readyState !== 4) return;
      if (req.status === 401) { setStatus(authHintKey(), {}, true); return; }
      if (req.status !== 200) {
        setStatus('err.list.http', {code: req.status}, true);
        return;
      }
      try { render(JSON.parse(req.responseText)); }
      catch (err) { setStatus('err.list.parse', {}, true); }
    };
    req.send();
  }

  document.getElementById('refreshBtn').onclick = refresh;

  document.getElementById('mkdirBtn').onclick = function () {
    var name = folderEl.value.trim();
    if (!name) { setStatus('err.mkdir.name', {}, true); return; }
    var req = new XMLHttpRequest();
    req.open('POST', '/mkdir.cgi', true);
    req.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    req.onreadystatechange = function () {
      if (req.readyState !== 4) return;
      if (req.status === 200) {
        folderEl.value = '';
        setStatus('status.mkdir.done', {name: name}, false);
        refresh();
      } else {
        setStatus('err.mkdir.http', {code: req.status}, true);
      }
    };
    req.send('name=' + encodeURIComponent(name));
  };

  uploadBtn.onclick = function () {
    if (!fileEl.files || !fileEl.files.length) {
      setStatus('err.upload.noFile', {}, true);
      return;
    }
    /* All selected files go into one POST, so one progress bar reports the
     * progress of the whole batch (accurate and no extra requests). */
    var fd = new FormData();
    var finished = false;
    resetSpeed();
    for (var i = 0; i < fileEl.files.length; i++) {
      fd.append('file', fileEl.files[i]);
      batchBytes += fileEl.files[i].size;
    }
    var req = new XMLHttpRequest();
    req.open('POST', '/upload.cgi', true);

    /* Single exit point: idempotent so onreadystatechange / onerror / a
     * synchronous send() failure cannot double-notify or leave the bar up. */
    function finalize(ok, key, params, isError) {
      if (finished) return;
      finished = true;
      hideProgress();
      uploadBtn.disabled = false;
      /* refresh() clears the status line, so set ours AFTER it. */
      if (ok) { fileEl.value = ''; refresh(); }
      setStatus(key, params, isError);
    }

    /* Must be set after open() and before send(): progress is for the
     * request body, i.e. the complete multipart batch. */
    req.upload.onprogress = function (e) {
      if (finished) return;
      var t1 = nowMs();
      speedSeen = t1;
      if (!e.lengthComputable || !(e.total > 0)) return;
      var elapsed = t1 - speedLastTime;
      if (elapsed >= SPEED_SAMPLE_MS) {
        var delta = e.loaded - speedLastLoaded;
        if (delta >= 0 && elapsed > 0) {
          var instant = delta * 1000 / elapsed;
          speedValue = speedValue > 0
            ? speedValue * (1 - SPEED_SMOOTH) + instant * SPEED_SMOOTH
            : instant;
        }
        speedLastLoaded = e.loaded;
        speedLastTime = t1;
      }
      showProgress(e.loaded / e.total * 100, formatSpeed(speedValue));
    };

    req.onreadystatechange = function () {
      if (req.readyState !== 4 || finished) return;
      if (req.status === 200) {
        var secs = (speedSeen - speedStart) / 1000;
        var avg = (secs > 0 && batchBytes > 0) ? batchBytes / secs : 0;
        var avgText = avg > 0 ? t('status.avg', {speed: formatSpeed(avg)}) : '';
        finalize(true, 'status.uploaded',
          {detail: String(req.responseText).trim(), avg: avgText}, false);
      } else if (req.status === 401) {
        finalize(false, authHintKey(), {}, true);
      } else {
        finalize(false, 'err.upload.http',
          {code: req.status, detail: req.responseText}, true);
      }
    };

    /* Deliberately NO req.timeout: large backups over a slow LAN can take
     * minutes, and a fixed deadline would report false failures.  onerror
     * covers aborts, network loss and the server closing the connection. */
    req.onerror = function () {
      finalize(false, 'err.upload.network', {}, true);
    };

    uploadBtn.disabled = true;
    showProgress(0, '');
    setStatus('status.uploading', {}, false);
    try {
      req.send(fd);
    } catch (err) {
      finalize(false, 'err.upload.failed', {detail: err.message}, true);
    }
  };

  setLang(loadLang());
  refresh();
}());
</script>
</body>
</html>
